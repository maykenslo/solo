services:
  - type: web
    name: deploiement-test
    plan: free
    env: java
    buildCommand: |
      echo "====== Environnement Render ======"
      printenv
      echo "====== Vérification Java ======"
      which java
      java -version || echo "java non disponible"
      echo "====== Vérification JAVA_HOME ======"
      echo "$JAVA_HOME"
      ./mvnw -v || echo "Échec mvnw -v"
      ./mvnw clean install
    startCommand: java -jar target/deploiement_test-0.0.1-SNAPSHOT.jar
    envVars:
      - key: JAVA_VERSION
        value: 11
      - key: DB_URL
        fromGroup: groupforthefirsttest
      - key: DB_USERNAME
        fromGroup: groupforthefirsttest
      - key: DB_PASSWORD
        fromGroup: groupforthefirsttest
